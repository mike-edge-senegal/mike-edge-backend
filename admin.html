// ============================================
// 🗜️ COMPRESSION AUTO HD (V11.16+)
// Redimensionne à max 1080px de large, qualité JPEG 80%
// ============================================
async function compressImage(file, options) {
    options = options || {};
    var maxWidth = options.maxWidth || 1080;
    var quality = options.quality || 0.8;
    
    return new Promise(function(resolve, reject) {
        var img = new Image();
        var url = URL.createObjectURL(file);
        
        img.onload = function() {
            URL.revokeObjectURL(url);
            var w = img.width;
            var h = img.height;
            
            // Redimensionnement proportionnel
            if (w > maxWidth) {
                h = Math.round(h * maxWidth / w);
                w = maxWidth;
            }
            
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            
            canvas.toBlob(function(blob) {
                var compressed = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), {
                    type: 'image/jpeg',
                    lastModified: Date.now()
                });
                console.log('[COMPRESS] ' + file.name + ': ' + (file.size/1024).toFixed(0) + 'Ko → ' + (compressed.size/1024).toFixed(0) + 'Ko (' + Math.round(100*compressed.size/file.size) + '%)');
                resolve(compressed);
            }, 'image/jpeg', quality);
        };
        
        img.onerror = function() {
            URL.revokeObjectURL(url);
            reject(new Error('Erreur chargement image'));
        };
        
        img.src = url;
    });
}

async function loadKioskDetail(){
    var mag=kioskAlbums.find(function(m){return m.id===kioskCurrentId});
    if(!mag){showToast("Album introuvable.");showKioskList();return}
    document.getElementById('kioskDetailCover').src=mag.cover_url||'';
    document.getElementById('kioskDetailTitle').textContent=mag.title;
    document.getElementById('kioskDetailDate').textContent=mag.edition_date;

    try{
        var r=await fetch(API_BASE+'/magazines/'+kioskCurrentId+'/pages',{method:'GET'});
        var j=await r.json();
        var pages=j.success?j.data:[];
        document.getElementById('kioskDetailCounter').textContent=pages.length+'/10';
        var list=document.getElementById('kioskPagesList');
        list.innerHTML='';
        pages.forEach(function(p){
            var row=document.createElement('div');
            row.className='kiosk-page-row';
            row.innerHTML=
                '<span class="kiosk-page-num">P.'+p.page_number+'</span>'+

            list.appendChild(row);
        });
        mag.page_count=pages.length;
    }catch(e){showToast("Erreur chargement pages: "+e.message)}

async function deleteKioskPage(pageNumber){
    if(!confirm("Supprimer la page "+pageNumber+" ?"))return;
    setLoading(true,'SUPPRESSION...');
    try{
        var adminKey=getAdminKey();
        var pageRow=await supabaseClient.from('magazine_pages').select('id,image_url').eq('magazine_id',kioskCurrentId).eq('page_number',pageNumber).single();
        if(pageRow.error||!pageRow.data)throw new Error("Page introuvable");

        var r=await fetch(API_BASE+'/magazines/pages/'+pageRow.data.id,{method:'DELETE',headers:{'x-admin-key':adminKey}});
        var j=await r.json();
        if(!j.success)throw new Error(j.code||"Échec suppression");

        var path=j.deleted_url.split('/magazines/')[1];
        if(path)await supabaseClient.storage.from('magazines').remove([path]);

        showToast("🗑 Page supprimée",'success');
        await loadKioskDetail();
    }catch(e){showToast("Erreur: "+e.message)}finally{setLoading(false)}
}

function handleAddPagesSelect(input){
    var files=Array.from(input.files||[]);
    if(!files.length)return;
    var mag=kioskAlbums.find(function(m){return m.id===kioskCurrentId});
    var currentCount=mag?mag.page_count:0;
    if(currentCount+kioskAddSelectedPages.length+files.length>10){
        showToast("❌ Dépassement : "+(currentCount+kioskAddSelectedPages.length+files.length)+"/10 pages max.");
        input.value='';return;
    }
    for(var i=0;i<files.length;i++){
        var err=validateImageFile(files[i]);
        if(err){showToast(err);continue}
        kioskAddSelectedPages.push(files[i]);
    }
    renderKioskAddQueue();input.value='';
}

function renderKioskAddQueue(){
    var c=document.getElementById('kioskAddQueueContainer'),g=document.getElementById('kioskAddQueueGrid');
    kioskAddPageObjectUrls.forEach(function(u){URL.revokeObjectURL(u)});kioskAddPageObjectUrls=[];
    if(!kioskAddSelectedPages.length){c.style.display='none';return}
    c.style.display='block';
    document.getElementById('kioskAddQueueCount').textContent=kioskAddSelectedPages.length+' page(s) prête(s)';
    g.innerHTML='';
    kioskAddSelectedPages.forEach(function(file,idx){
        var thumb=document.createElement('div');thumb.className='page-thumb';
        var img=document.createElement('img');var url=URL.createObjectURL(file);kioskAddPageObjectUrls.push(url);img.src=url;
        var rm=document.createElement('button');rm.className='page-thumb-remove';rm.textContent='✕';
        rm.onclick=function(){kioskAddSelectedPages.splice(idx,1);renderKioskAddQueue()};
        thumb.appendChild(img);thumb.appendChild(rm);g.appendChild(thumb);
    });
}

async function uploadNewPages(){
    if(!kioskAddSelectedPages.length)return;
    setLoading(true,'COMPRESSION & ENVOI...');
    try{
        var mag=kioskAlbums.find(function(m){return m.id===kioskCurrentId});
        var startNum=(mag?mag.page_count:0)+1;
        for(var i=0;i<kioskAddSelectedPages.length;i++){
            var f=await compressImage(kioskAddSelectedPages[i],{maxWidth:1080,quality:0.8}).catch(function(){return kioskAddSelectedPages[i]});
            var pn='pages/'+kioskCurrentId+'/'+Date.now()+'_p'+(startNum+i)+'_'+f.name;
            await supabaseClient.storage.from('magazines').upload(pn,f);
            var pd=supabaseClient.storage.from('magazines').getPublicUrl(pn);
            await supabaseClient.from('magazine_pages').insert([{magazine_id:kioskCurrentId,page_number:startNum+i,image_url:pd.data.publicUrl}]);
        }
        showToast("📤 Pages ajoutées !",'success');
        kioskAddSelectedPages=[];renderKioskAddQueue();
        await loadKioskDetail();
    }catch(e){showToast("Erreur: "+e.message)}finally{setLoading(false)}
}

    '[META_MATCH]','=== DEBUT FICHE MATCH ===','🎯 AUDIT','FIN FICHE','=== FIN FICHE ==='
];

function normalizeHeaderClient(v){ return String(v||'').normalize('NFKC').replace(/[\uFE0F\u200D]/gu,'').replace(/\p{Extended_Pictographic}/gu,'').replace(/\s+/g,' ').trim().toLowerCase(); }
function escapeRegExpClient(v){ return String(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function headerMatchesClient(line,tag){ return new RegExp('^'+escapeRegExpClient(normalizeHeaderClient(tag))+'(?:\s*[:—\-⭐★✅✔].*)?$','iu').test(line); }
function getNextAliasesClient(currentAliases){
    const cur=new Set(currentAliases.map(normalizeHeaderClient));
    return SECTION_HEADERS_CLIENT.filter(a=>!cur.has(normalizeHeaderClient(a)));
}
function getSectionClient(text,aliases,nextAliases){
    if(typeof text!=='string')return null;
    const lines=text.split(/\r?\n/);
    let start=-1;
    for(let i=0;i<lines.length;i++){ if(aliases.some(a=>headerMatchesClient(normalizeHeaderClient(lines[i]),normalizeHeaderClient(a)))){start=i;break;} }
    if(start===-1)return null;
    let end=lines.length;
    for(let i=start+1;i<lines.length;i++){ if(nextAliases.some(a=>headerMatchesClient(normalizeHeaderClient(lines[i]),normalizeHeaderClient(a)))){end=i;break;} }
    return lines.slice(start+1,end).join('\n');
}
function extractTeamsClient(raw){
    const lines=raw.split(/\r?\n/);
    for(const line of lines){
        if(/^\s*(?:MATCH|EQUIPES?)\s*:/iu.test(line)){
            const c=line.replace(/^\s*(?:MATCH|EQUIPES?)\s*:\s*/iu,'').trim();
            const m=c.match(/^(.+?)\s+(?:vs\.?|contre|[-—–\/]|v)\s+(.+)$/iu);
            if(m)return{home_team:m[1].trim(),away_team:m[2].trim()};
        }
    }
    for(const line of lines){
        if(/^\s*(?:CAT|RANG|DATE|HEURE|LIGUE|COMPETITION|IRG|AUDIT|P\d|BAN\d|\[|===|🏟️)/iu.test(line))continue;
        const m=line.trim().match(/^(.+?)\s+(?:vs\.?|contre|[-—–\/]|v)\s+(.+)$/iu);
        if(m)return{home_team:m[1].trim(),away_team:m[2].trim()};
    }
    return{home_team:null,away_team:null};
}
function extractLineClient(block,kw){
    if(!block)return null;
    const re=new RegExp(escapeRegExpClient(kw),'iu');
    const line=block.split(/\r?\n/).find(l=>re.test(l.normalize('NFC')));
    return line?line.trim():null;
}
function extractOddsClient(block,tag){
    if(!block)return null;
    if(tag){ const cm=block.match(new RegExp('\\b'+escapeRegExpClient(tag)+'\s*:\s*([\d]+(?:[.,]\d+)?)','iu')); if(cm)return Number(cm[1].replace(',','.')); }
    const pm=block.match(/\b(?:COTE_TOTALE|COTE TOTALE)\s*:\s*([\d]+(?:[.,]\d+)?)/iu);
    if(pm)return Number(pm[1].replace(',','.'));
    const m=block.match(/\b(?:COTE)\s*:\s*([\d]+(?:[.,]\d+)?)/iu);
    return m?Number(m[1].replace(',','.')):null;
}
function extractPctClient(block){
    if(!block)return null;
    for(const line of block.split(/\r?\n/)){
        const m=line.match(/(?:Probabilité|PROBABILITE|Proba)[^:]*:\s*([\d.,]+)\s*%/iu);
        if(m){ const v=Number(m[1].replace(',','.')); return Number.isFinite(v)?Math.round(v):null; }
    }
    return null;
}
function extractRobClient(block){
    if(!block)return null;
    for(const line of block.split(/\r?\n/)){
        const m=line.match(/(?:Robustesse|ROBUSTESSE|ROB\b|Confiance|Conf\b)[^:]*:\s*(\d+(?:[.,]\d+)?)\s*(?:\/\s*100)?/iu);
        if(m){ const v=Number(m[1].replace(',','.')); return Number.isFinite(v)?Math.round(v):null; }
    }
    return null;
}
function extractConfClient(block){
    if(!block)return null;
    const em=block.match(/(?:Étoiles|ETOILES|STARS)\s*:\s*([1-5])/iu);
    if(em)return Number(em[1]);
    const nm=block.match(/(?:CONFIANCE|CONF|Note de Confiance)\s*[:\-]?\s*(\d{1,3})\s*(?:\/\s*100)?/iu);
    if(nm){
        const n=Number(nm[1]);
        if(n>=80)return 5; if(n>=60)return 4; if(n>=40)return 3; if(n>=20)return 2; return 1;
    }
    return null;
}
function extractMarketClient(block,labels){
    if(!block)return null;
    for(const line of block.split(/\r?\n/)){
        const trimmed=line.trim();
        for(const label of labels){
            const m=trimmed.match(new RegExp('^\\s*'+escapeRegExpClient(label)+'\\s*(?::|—|-)\\s*(.+)$','ium'));
            if(m){
                let val=m[1].trim();
                const pipeIdx=val.indexOf('|');
                if(pipeIdx!==-1)val=val.substring(0,pipeIdx).trim();
                if(val)return val;
            }
        }
    }
    return null;
}
function extractExplicitRankClient(block){
    if(!block)return 0;
    if(/^\s*(?:🥇|①)/.test(block))return 1;
    if(/^\s*(?:🥈|②)/.test(block))return 2;
    if(/^\s*(?:🥉|③)/.test(block))return 3;
    if(/^\s*(?:4️⃣)/.test(block))return 4;
    if(/^\s*(?:5️⃣)/.test(block))return 5;
    const m=block.match(/(?:RANG|P|O)\s*(\d+)/i);
    return m?Number(m[1]):0;
}

function parseTelegramTextClient(rawText){
    const out={
        raw_text_length:typeof rawText==='string'?rawText.length:0,
        parser_version:PARSER_VERSION_CLIENT,
        publication_title:null,
        match_info:{home_team:null,away_team:null,date_str:null,time_str:null,league_name:null,irg_index:null,category_name:null,rank_in_category:null},
        pari_du_jour:null, top_5_premium:[], top_3_opportunites:[],
        value_bet_premium:null, value_bet_speculatif:null,
        ticket_combine:null, paris_a_bannir:[]
    };
    if(typeof rawText!=='string'||!rawText.trim()||rawText.length>50000)return out;

    const teams=extractTeamsClient(rawText);
    out.match_info.home_team=teams.home_team;
    out.match_info.away_team=teams.away_team;

    const catM=rawText.match(/^\s*CAT(?:E|É)GORIE\s*:\s*([A-Z0-9_]+)\s*$/imu);
    const dateM=rawText.match(/📅\s*([^|\n•]+)/iu)||rawText.match(/^\s*DATE\s*:\s*([^|\n•]+)\s*$/imu);
    const timeM=rawText.match(/(?:HEURE\s*[:—\-]|•\s*HEURE\s*[:—\-]|HEURE\s*)\s*(\d{1,2}:\d{2})/iu)||rawText.match(/^\s*HEURE\s*:\s*(\d{1,2}:\d{2})/imu)||rawText.match(/(?:HEURE\s*:|\bHEURE\b)\s*(\d{1,2}:\d{2})/iu);
    const leagueM=rawText.match(/(?:COMPÉTITION|COMPETITION|LIGUE)\s*:\s*([^|\n]+)/iu)||rawText.match(/^\s*COMPÉTITION\s*[-—]\s*([^\n]+)$/imu);
    const irgM=rawText.match(/(?:SCORE\s+IRG|IRG)\s*:\s*(\d{1,3})\b/iu)||rawText.match(/\bIR\s*:\s*(\d{1,3})\b/iu);

    out.match_info.category_name=catM?catM[1].toUpperCase().trim():'CHAMPIONNAT';
    out.match_info.date_str=dateM?dateM[1].trim():null;
    out.match_info.time_str=timeM?timeM[1].trim():null;
    out.match_info.league_name=leagueM?leagueM[1].trim():'Ligue Internationale';
    out.match_info.irg_index=irgM?Number(irgM[1]):80;
    out.match_info.rank_in_category=1; // V11.17.5 : classement par IRG côté API

    if(out.match_info.home_team&&out.match_info.away_team&&out.match_info.league_name){
        out.publication_title=out.match_info.home_team+' vs '+out.match_info.away_team+' — '+out.match_info.league_name;
    }

    const meta=getSectionClient(rawText,['[META_MATCH]','=== DEBUT FICHE MATCH ==='],getNextAliasesClient(['[META_MATCH]','=== DEBUT FICHE MATCH ===']))||'';
    const gProb=extractPctClient(meta), gRob=extractRobClient(meta), gStars=extractConfClient(meta);

    const pdjS=getSectionClient(rawText,DICTIONARY_CLIENT.PDJ,getNextAliasesClient(DICTIONARY_CLIENT.PDJ));
    if(pdjS){
        out.pari_du_jour={section_type:'PARI_DU_JOUR',rank_in_section:1,
            market_name:extractMarketClient(pdjS,DICTIONARY_CLIENT.MARKET_LABELS)||extractLineClient(pdjS,'MARCHE'),
            odds:extractOddsClient(pdjS), probability_pct:extractPctClient(pdjS)??gProb,
            robustness_pct:extractRobClient(pdjS)??gRob??out.match_info.irg_index,
            confidence_stars:extractConfClient(pdjS)??gStars};
    }

    const top5S=getSectionClient(rawText,DICTIONARY_CLIENT.TOP5,getNextAliasesClient(DICTIONARY_CLIENT.TOP5));
    if(top5S){
        top5S.split(/(?=^\s*(?:🥇|🥈|🥉|4️⃣|5️⃣|P[1-5]\s*:|\d\.\s*(?:SÉCURITÉ|VALEUR|OPPORTUNITÉ)))/gim)
        .filter(b=>/^\s*(?:🥇|🥈|🥉|4️⃣|5️⃣|P\d|P\d\s*:|\d\.)/im.test(b)).slice(0,5)
        .forEach((block,idx)=>{
            const r=extractExplicitRankClient(block)||(idx+1);
            out.top_5_premium.push({section_type:'TOP_5',rank_in_section:r,
                market_name:extractMarketClient(block,DICTIONARY_CLIENT.MARKET_LABELS)||extractLineClient(block,'P'+r),
                odds:extractOddsClient(block), probability_pct:extractPctClient(block),
                robustness_pct:extractRobClient(block), confidence_stars:extractConfClient(block)});
        });
    }

    const oppS=getSectionClient(rawText,DICTIONARY_CLIENT.OPP,getNextAliasesClient(DICTIONARY_CLIENT.OPP));
    if(oppS){
        oppS.split(/(?=^\s*(?:①|②|③|O[1-3]\s*:|Opportunité\s*\d))/gim)
        .filter(b=>/^\s*(?:①|②|③|O[1-3]|O[1-3]\s*:|Opportunité\s*\d)/im.test(b)).slice(0,3)
        .forEach((block,idx)=>{
            const r=extractExplicitRankClient(block)||(idx+1);
            out.top_3_opportunites.push({section_type:'OPPORTUNITE',rank_in_section:r,
                market_name:extractMarketClient(block,DICTIONARY_CLIENT.MARKET_LABELS)||extractLineClient(block,'O'+r),
                odds:extractOddsClient(block), probability_pct:extractPctClient(block),
                robustness_pct:extractRobClient(block), confidence_stars:extractConfClient(block)});
        });
    }

    const valPS=getSectionClient(rawText,DICTIONARY_CLIENT.VALUE_PREMIUM,getNextAliasesClient(DICTIONARY_CLIENT.VALUE_PREMIUM));
    if(valPS){ out.value_bet_premium={section_type:'VALUE_PREMIUM',rank_in_section:1,market_name:extractMarketClient(valPS,DICTIONARY_CLIENT.MARKET_LABELS)||extractLineClient(valPS,'MARCHE'),odds:extractOddsClient(valPS),probability_pct:extractPctClient(valPS),robustness_pct:extractRobClient(valPS),confidence_stars:extractConfClient(valPS)}; }

    const valSS=getSectionClient(rawText,DICTIONARY_CLIENT.VALUE_SPECULATIF,getNextAliasesClient(DICTIONARY_CLIENT.VALUE_SPECULATIF));
    if(valSS){ out.value_bet_speculatif={section_type:'VALUE_SPECULATIF',rank_in_section:1,market_name:extractMarketClient(valSS,DICTIONARY_CLIENT.MARKET_LABELS)||extractLineClient(valSS,'MARCHE'),odds:extractOddsClient(valSS),probability_pct:extractPctClient(valSS),robustness_pct:extractRobClient(valSS),confidence_stars:extractConfClient(valSS)}; }

    const ticS=getSectionClient(rawText,DICTIONARY_CLIENT.COMBINE,getNextAliasesClient(DICTIONARY_CLIENT.COMBINE));
    if(ticS){
        const sel1=extractLineClient(ticS,'SEL1')||extractLineClient(ticS,'Sélection 1');
        const sel2=extractLineClient(ticS,'SEL2')||extractLineClient(ticS,'Sélection 2');
        out.ticket_combine={section_type:'COMBINE',rank_in_section:1,market_name:'Ticket Combiné Premium',
            odds:extractOddsClient(ticS,'COTE_TOTALE')??extractOddsClient(ticS,'Cote'),
            confidence_stars:extractConfClient(ticS),
            comment:[sel1,sel2].filter(Boolean).join(' + ')||'Sélections d\'élite combinées'};
    }

    const banS=getSectionClient(rawText,DICTIONARY_CLIENT.BANNED,getNextAliasesClient(DICTIONARY_CLIENT.BANNED));
    if(banS){
        const seen=new Set();
        for(const line of banS.split('\n')){
            const bm=line.match(/^\s*BAN(\d+)\s*:\s*([^|\n]+?)(?:\s*\|\s*(?:RAISON\s*:)?\s*(.*))?$/i);
            if(!bm)continue;
            const r=Number(bm[1]); if(r<1||r>3||seen.has(r))continue; seen.add(r);
            out.paris_a_bannir.push({section_type:'BANNED',rank_in_section:r,market_name:bm[2].trim(),reason:bm[3]?bm[3].trim():'Risque élevé'});
        }
    }
    return out;
}

var activeSessions = {};

const CATEGORIES=[

];

let existingMatches={};

            if(action==='edit')toggleEdit(sec,idx);
            else if(action==='delete')deleteCard(sec,idx);
            else if(action==='star')setEditStar(target,parseInt(target.dataset.star));
            else if(action==='save')saveEdit(sec,idx);
            else if(action==='cancel')cancelEdit(sec,idx);
        });
        previewBox.addEventListener('touchstart',function(e){
            var target=e.target.closest('[data-action]');if(!target)return;
            e.preventDefault();e.stopPropagation();
            var action=target.dataset.action,sec=target.dataset.sec,idx=parseInt(target.dataset.idx);
            if(action==='edit')toggleEdit(sec,idx);
            else if(action==='delete')deleteCard(sec,idx);
            else if(action==='star')setEditStar(target,parseInt(target.dataset.star));
            else if(action==='save')saveEdit(sec,idx);
            else if(action==='cancel')cancelEdit(sec,idx);
        },{passive:false});
    }
});

async function loadDashboard(){
    document.getElementById('pronosGlobalStatus').textContent='⏳ Sync...';
    
    const promises=CATEGORIES.map(c=>fetch(API_BASE+'/matches/'+c.key,{headers:{'Accept':'application/json'}}).then(r=>r.ok?r.json():{success:false,data:[],session:null}).catch(()=>({success:false,data:[],session:null})));
    const results=await Promise.all(promises);
    
    results.forEach((res,i)=>{ 
        existingMatches[CATEGORIES[i].key]=(res.success&&Array.isArray(res.data))?res.data:[]; 
        // 🔧 Utiliser res.session directement depuis /matches/:category
        if (res.session) {
            activeSessions[CATEGORIES[i].key] = res.session;
            console.log('[DASHBOARD] Session chargée pour', CATEGORIES[i].key, ':', res.session);
        } else {
            // Fallback si le backend ne renvoie pas session (version non corrigée)
            activeSessions[CATEGORIES[i].key] = { 
                id: null, 
                number: null, 
                status: 'UNKNOWN', 
                current_count: 0, 
                max_quota: CATEGORIES[i].key === 'ELITE_MONDIALE' ? 10 : 5, 
                remaining_slots: CATEGORIES[i].key === 'ELITE_MONDIALE' ? 10 : 5, 
                can_import: true 
            };
        }
    });
    renderDashboard();
    document.getElementById('pronosGlobalStatus').textContent='✅ Sync';
}

function renderDashboard(){
    const grid=document.getElementById('categoriesGrid');
    grid.innerHTML='';
    CATEGORIES.forEach(cat=>{
        // 🔧 SESSION ACTIVE : récupérer le compteur depuis activeSessions
        const sessionData = activeSessions[cat.key] || {};
        const activeCount = sessionData.current_count || 0;
        const sessionNumber = sessionData.number || '?';
        const isActiveFull = activeCount >= cat.quota;
        const canImport = sessionData.can_import !== false;
        
        // 🔧 Historique conservé pour l'affichage des matchs
        const matches = existingMatches[cat.key] || [];
        const sorted = [...matches].sort((a,b)=>{ 
            const ia=Number(a.irg_index??a.irg??0), ib=Number(b.irg_index??b.irg??0); 
            return ib-ia; 
        });
        let irgHtml='';
        sorted.forEach(m=>{ 
            const irg=m.irg_index??m.irg??'?'; 
            irgHtml+=`<div class="cat-irg-item"><span class="cat-irg-teams">${m.home_team||'??'} vs ${m.away_team||'??'}</span><span class="cat-irg-score">IRG ${irg}</span></div>`; 
        });
        
        // 🔧 Badge basé sur activeCount (session active)
        const badgeClass = isActiveFull ? 'full' : (activeCount > 0 ? 'ok' : 'warn');
        const badgeText = isActiveFull ? 'COMPLET' : (activeCount + '/' + cat.quota);
        const pct = Math.min(100, (activeCount / cat.quota) * 100);
        const isFull = activeCount >= cat.quota;
        
        const card=document.createElement('div');
        card.className='cat-card';
        card.style.borderLeft=`3px solid ${cat.color}`;
        card.innerHTML=`
            <div class="cat-card-header">
                <span class="cat-title">${cat.label}</span>
                <span class="cat-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
            <div class="cat-sub">${isFull ? 'Quota atteint — cliquez pour importer' : (cat.quota - activeCount) + ' place(s) libre(s)'}</div>
            <div style="font-size:10px;color:var(--diamond-cyan);margin-top:4px;">
                📌 Session #${sessionNumber} : ${activeCount}/${cat.quota} 
                ${isActiveFull ? '🔒 COMPLETE' : '✅ ACTIVE'}
            </div>
            <div class="cat-irg-list">${irgHtml}</div>
        `;
        card.onclick=()=>openSaisie(cat);
        grid.appendChild(card);
    });
}

function openSaisie(cat){
    if(!cat)return;
    currentCat=cat;
    document.getElementById('pronosDashboard').classList.remove('active');
    document.getElementById('pronosSaisie').classList.add('active');
    document.getElementById('saisieCatTitle').textContent=cat.label;
    document.getElementById('publishCatName').textContent=cat.label;
    
    // 🔧 Utiliser le compteur de la session active
    const sessionData = activeSessions[cat.key] || {};
    const activeCount = sessionData.current_count || 0;
    document.getElementById('saisieCatCounter').textContent=activeCount+'/'+cat.quota;
    
    document.getElementById('ficheInput').value='';
    document.getElementById('fichePreview').style.display='none';
    document.getElementById('btnPublier').classList.remove('active');
    document.getElementById('catMismatchAlert').classList.remove('show');
    currentParsed=null;
}

function showPronosDashboard(){
    document.getElementById('pronosSaisie').classList.remove('active');
    document.getElementById('pronosDashboard').classList.add('active');
    loadDashboard();
}

function analyserFiche(){
    const raw=document.getElementById('ficheInput').value.trim();
    if(!raw){showToast('Collez une fiche.','error');return;}
    const parsed=parseTelegramTextClient(raw);
    currentParsed=parsed;
    const detectedCat=parsed.match_info.category_name;
    const alertBox=document.getElementById('catMismatchAlert');
    if(detectedCat && detectedCat!=='CHAMPIONNAT' && detectedCat!==currentCat.key){
        alertBox.textContent=`⚠️ Catégorie détectée : ${detectedCat}. Tu publies dans ${currentCat.label}.`;
        alertBox.classList.add('show');
    }else{ alertBox.classList.remove('show'); }
    renderPreview(parsed);
    document.getElementById('fichePreview').style.display='flex';
    document.getElementById('btnPublier').classList.add('active');
}

function renderPreview(parsed){
    const box=document.getElementById('fichePreview');
    box.innerHTML='';

    // Infos match
    const info=document.createElement('div');
    info.className='match-info-card';
    info.innerHTML=`<div class="match-info-row"><span class="match-info-label">MATCH</span><span class="match-info-value">${parsed.match_info.home_team||'??'} vs ${parsed.match_info.away_team||'??'}</span></div><div class="match-info-row"><span class="match-info-label">COMPÉTITION</span><span class="match-info-value">${parsed.match_info.league_name||'??'}</span></div><div class="match-info-row"><span class="match-info-label">DATE / HEURE</span><span class="match-info-value">${parsed.match_info.date_str||'??'} · ${parsed.match_info.time_str||'??'}</span></div><div class="match-info-row"><span class="match-info-label">IRG</span><span class="match-info-value" style="color:var(--gold-bright)">${parsed.match_info.irg_index??'?'}/100</span></div>`;
    box.appendChild(info);

    // Sections
    const sections=[
        {key:'pari_du_jour', title:'🎯 PARI DU JOUR', arr:parsed.pari_du_jour?[parsed.pari_du_jour]:[], max:1},
        {key:'top_5_premium', title:'🏆 TOP 5 PREMIUM', arr:parsed.top_5_premium, max:5},
        {key:'top_3_opportunites', title:'💡 TOP 3 OPPORTUNITÉS', arr:parsed.top_3_opportunites, max:3},
        {key:'value_bet_premium', title:'💎 VALUE BET PREMIUM', arr:parsed.value_bet_premium?[parsed.value_bet_premium]:[], max:1},
        {key:'value_bet_speculatif', title:'🎰 VALUE BET SPÉCULATIF', arr:parsed.value_bet_speculatif?[parsed.value_bet_speculatif]:[], max:1},
        {key:'ticket_combine', title:'🎟️ TICKET COMBINÉ', arr:parsed.ticket_combine?[parsed.ticket_combine]:[], max:1},
        {key:'paris_a_bannir', title:'🚫 PARIS À BANNIR', arr:parsed.paris_a_bannir, max:3}
    ];

    sections.forEach(sec=>{
        if(!sec.arr||!sec.arr.length)return;
        const wrap=document.createElement('div');
        wrap.className='preview-section';
        const countText=sec.max>1?`${sec.arr.length}/${sec.max}`:(sec.arr.length?'1/1':'0/1');
        const overLimit=sec.arr.length>sec.max;
        wrap.innerHTML=`<div class="preview-section-header"><span>${sec.title}</span><span class="preview-section-count" style="color:${overLimit?'var(--alert-red)':'var(--text-muted)'}">${countText}${overLimit?' ⚠️ EXCÈS':''}</span></div>`;
        sec.arr.forEach((item,idx)=>{
            const card=document.createElement('div');
            card.className='preview-match-card';
            const hasErr=!item.market_name;
            const hasWarn=!item.odds && item.section_type!=='BANNED';
            card.classList.add(hasErr?'error':(hasWarn?'warn':'ok'));
            card.id=`card-${sec.key}-${idx}`;

            let rankLabel='';
            if(item.section_type==='TOP_5') rankLabel=['🥇','🥈','🥉','4️⃣','5️⃣'][item.rank_in_section-1]||'P'+item.rank_in_section;
            else if(item.section_type==='OPPORTUNITE') rankLabel=['①','②','③'][item.rank_in_section-1]||'O'+item.rank_in_section;
            else if(item.section_type==='BANNED') rankLabel='BAN'+item.rank_in_section;
            else rankLabel='★';

            let metricsHtml='';
            if(item.section_type!=='BANNED'){
                metricsHtml=`<span class="preview-metric"><b>Cote:</b> ${item.odds??'?'}</span>`;
                if(item.probability_pct!=null) metricsHtml+=`<span class="preview-metric"><b>Proba:</b> ${item.probability_pct}%</span>`;
                if(item.robustness_pct!=null) metricsHtml+=`<span class="preview-metric"><b>Rob:</b> ${item.robustness_pct}%</span>`;
                if(item.confidence_stars!=null) metricsHtml+=`<span class="preview-metric"><b>Conf:</b> ${'⭐'.repeat(item.confidence_stars)}</span>`;
            }else{
                metricsHtml=`<span class="preview-metric" style="color:var(--alert-red)"><b>Raison:</b> ${item.reason||'—'}</span>`;
            }
            if(item.comment) metricsHtml+=`<span class="preview-metric"><b>Note:</b> ${item.comment}</span>`;

            card.innerHTML=`<div class="preview-rank">${rankLabel}</div><div class="preview-market">${item.market_name||'<span style="color:var(--alert-red)">Marché non détecté</span>'}</div><div class="preview-metrics">${metricsHtml}</div><div class="preview-actions"><button data-action="edit" data-sec="${sec.key}" data-idx="${idx}">✏️ Modifier</button>${item.section_type!=='BANNED'?`<button data-action="delete" data-sec="${sec.key}" data-idx="${idx}">🗑️ Supprimer</button>`:''}</div>`;
            wrap.appendChild(card);

            // Formulaire d'édition caché
            const editForm=document.createElement('div');
            editForm.className='edit-form';
            editForm.id=`edit-${sec.key}-${idx}`;
            const isBanned=item.section_type==='BANNED';
            let starsHtml='';
            for(let s=1;s<=5;s++){ starsHtml+=`<button type="button" class="edit-star ${(item.confidence_stars||0)>=s?'on':''}" data-action="star" data-sec="${sec.key}" data-idx="${idx}" data-star="${s}">⭐</button>`; }
            editForm.innerHTML=`<input type="text" id="edit-market-${sec.key}-${idx}" placeholder="Marché" value="${(item.market_name||'').replace(/"/g,'&quot;')}">${isBanned?'':`<input type="number" step="0.01" id="edit-odds-${sec.key}-${idx}" placeholder="Cote" value="${item.odds??''}"><input type="number" id="edit-proba-${sec.key}-${idx}" placeholder="Probabilité %" value="${item.probability_pct??''}"><input type="number" id="edit-rob-${sec.key}-${idx}" placeholder="Robustesse %" value="${item.robustness_pct??''}"><div class="edit-stars" id="edit-stars-${sec.key}-${idx}">${starsHtml}</div>`}<div class="edit-actions"><button class="btn btn-emerald" data-action="save" data-sec="${sec.key}" data-idx="${idx}">✓ Valider</button><button class="btn" style="background:rgba(255,255,255,0.1);color:var(--text-primary)" data-action="cancel" data-sec="${sec.key}" data-idx="${idx}">Annuler</button></div>`;
            wrap.appendChild(editForm);
        });
        box.appendChild(wrap);
    });
}

function toggleEdit(secKey,idx){
    const form=document.getElementById(`edit-${secKey}-${idx}`);
    form.classList.toggle('active');
}
function cancelEdit(secKey,idx){
    document.getElementById(`edit-${secKey}-${idx}`).classList.remove('active');
}
function setEditStar(btn,val){
    const container=btn.parentElement;
    Array.from(container.children).forEach((b,i)=>{ b.classList.toggle('on',i<val); });
    container.dataset.value=val;
}
function saveEdit(secKey,idx){
    const item=currentParsed[secKey];
    const arr=Array.isArray(item)?item:[item];
    const target=arr[idx]; if(!target)return;
    target.market_name=document.getElementById(`edit-market-${secKey}-${idx}`).value.trim()||target.market_name;
    if(target.section_type!=='BANNED'){
        const oddsVal=document.getElementById(`edit-odds-${secKey}-${idx}`).value;
        if(oddsVal) target.odds=Number(oddsVal);
        const probaVal=document.getElementById(`edit-proba-${secKey}-${idx}`).value;
        if(probaVal) target.probability_pct=Math.round(Number(probaVal));
        const robVal=document.getElementById(`edit-rob-${secKey}-${idx}`).value;
        if(robVal) target.robustness_pct=Math.round(Number(robVal));
        const starsContainer=document.getElementById(`edit-stars-${secKey}-${idx}`);
        target.confidence_stars=Number(starsContainer.dataset.value||target.confidence_stars||0);
    }
    renderPreview(currentParsed);
}
function deleteCard(secKey,idx){
    const item=currentParsed[secKey];
    if(Array.isArray(item)){ item.splice(idx,1); if(!item.length) currentParsed[secKey]=secKey==='top_5_premium'||secKey==='top_3_opportunites'||secKey==='paris_a_bannir'?[]:null; }
    else currentParsed[secKey]=null;
    renderPreview(currentParsed);
}

function regenerateFiche(){
    if(!currentParsed)return '';
    const m=currentParsed.match_info;
    let text=`=== DEBUT FICHE MATCH ===\nMATCH : ${m.home_team||'??'} vs ${m.away_team||'??'}\nCOMPÉTITION : ${m.league_name||'??'}\nDATE : ${m.date_str||new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}\nHEURE : ${m.time_str||'??'}\nCATÉGORIE : ${currentCat.key}\nRANG : 1\nIRG : ${m.irg_index??80}\n`;

    if(currentParsed.pari_du_jour){
        const b=currentParsed.pari_du_jour;
        text+=`\n[PARI_DU_JOUR]\nMARCHE : ${b.market_name||'??'}\nCOTE : ${b.odds??'?'}\nPROBABILITÉ : ${b.probability_pct??'?'}%\nROBUSTESSE : ${b.robustness_pct??'?'}/100\nCONFIANCE : ${b.confidence_stars??'?'}\n`;
    }
    if(currentParsed.top_5_premium&&currentParsed.top_5_premium.length){
        text+=`\n[TOP_5_PREMIUM]\n`;
        currentParsed.top_5_premium.forEach(b=>{
            const rank=['🥇','🥈','🥉','4️⃣','5️⃣'][b.rank_in_section-1]||'P'+b.rank_in_section;
            text+=`${rank} P${b.rank_in_section} : MARCHE : ${b.market_name||'??'} | COTE : ${b.odds??'?'} | PROBA : ${b.probability_pct??'?'}% | ROB : ${b.robustness_pct??'?'}/100 | CONF : ${b.confidence_stars??'?'}/100\n`;
        });
    }
    if(currentParsed.top_3_opportunites&&currentParsed.top_3_opportunites.length){
        text+=`\n[OPPORTUNITES]\n`;
        currentParsed.top_3_opportunites.forEach(b=>{
            const rank=['①','②','③'][b.rank_in_section-1]||'O'+b.rank_in_section;
            text+=`${rank} O${b.rank_in_section} : MARCHE : ${b.market_name||'??'} | COTE : ${b.odds??'?'} | PROBA : ${b.probability_pct??'?'}% | ROB : ${b.robustness_pct??'?'}/100 | CONF : ${b.confidence_stars??'?'}/100\n`;
        });
    }
    if(currentParsed.value_bet_premium){
        const b=currentParsed.value_bet_premium;
        text+=`\n[VALUE_BET_PREMIUM]\nMARCHE : ${b.market_name||'??'}\nCOTE : ${b.odds??'?'}\nPROBABILITÉ : ${b.probability_pct??'?'}%\nROBUSTESSE : ${b.robustness_pct??'?'}/100\nCONFIANCE : ${b.confidence_stars??'?'}/100\n`;
    }
    if(currentParsed.value_bet_speculatif){
        const b=currentParsed.value_bet_speculatif;
        text+=`\n[VALUE_BET_SPECULATIF]\nMARCHE : ${b.market_name||'??'}\nCOTE : ${b.odds??'?'}\nPROBABILITÉ : ${b.probability_pct??'?'}%\nROBUSTESSE : ${b.robustness_pct??'?'}/100\nCONFIANCE : ${b.confidence_stars??'?'}/100\n`;
    }
    if(currentParsed.ticket_combine){
        const b=currentParsed.ticket_combine;
        text+=`\n[TICKET_COMBINE]\nSEL1 : ${b.comment?b.comment.split(' + ')[0]||'??':'??'}\nSEL2 : ${b.comment?b.comment.split(' + ')[1]||'??':'??'}\nCOTE_TOTALE : ${b.odds??'?'}\nCONFIANCE : ${b.confidence_stars??'?'}/100\n`;
    }
    if(currentParsed.paris_a_bannir&&currentParsed.paris_a_bannir.length){
        text+=`\n[PARIS_A_BANNIR]\n`;
        currentParsed.paris_a_bannir.forEach(b=>{
            text+=`BAN${b.rank_in_section} : ${b.market_name||'??'} | RAISON : ${b.reason||'Risque élevé'}\n`;
        });
    }
    text+=`=== FIN FICHE ===`;
    return text;
}

async function publierFiche(){
    if(!currentParsed||!currentCat)return;
    const adminKey=getAdminKey();
    if(!adminKey){showToast('Saisissez la clé admin.','error');return;}

    // Nettoyage : arrondir les pourcentages décimaux pour PostgreSQL INTEGER
    const clean=JSON.parse(JSON.stringify(currentParsed));
    ['pari_du_jour','value_bet_premium','value_bet_speculatif','ticket_combine'].forEach(k=>{
        if(clean[k]){if(clean[k].probability_pct!=null)clean[k].probability_pct=Math.round(clean[k].probability_pct);if(clean[k].robustness_pct!=null)clean[k].robustness_pct=Math.round(clean[k].robustness_pct);}
    });
    ['top_5_premium','top_3_opportunites','paris_a_bannir'].forEach(k=>{
        if(Array.isArray(clean[k]))clean[k].forEach(b=>{if(b.probability_pct!=null)b.probability_pct=Math.round(b.probability_pct);if(b.robustness_pct!=null)b.robustness_pct=Math.round(b.robustness_pct);});
    });
    currentParsed=clean;
    const cleanText=regenerateFiche();
    if(!cleanText){showToast('Aucune donnée à publier.','error');return;}

    // 🔧 SUPPRESSION DU BLOCAGE FRONTEND
    // Le quota est maintenant géré uniquement par le backend (database.js)
    // Le frontend envoie toujours la fiche, le backend décide de la rotation

    setLoading(true,'PUBLICATION...');
    try{
        const r=await fetch(API_BASE+'/import',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({raw_text:cleanText,user_id:1,category_override:currentCat.key})});
        const j=await r.json();
        if(r.ok&&j.success){
            showToast(`🚀 Publié ! ID: ${j.data.publication_id}`,'success'); localStorage.removeItem('mike_fiche_draft');
            document.getElementById('ficheInput').value='';
            document.getElementById('fichePreview').style.display='none';
            document.getElementById('btnPublier').classList.remove('active');
            currentParsed=null;
            
            // 🔧 CRITIQUE : Recharger l'état depuis le backend après succès
            // On recharge le dashboard qui récupère res.session depuis /matches/:category
            await loadDashboard();
        }else{
            const msg=j.message||j.code||JSON.stringify(j.errors||j);
            showToast(`Erreur: ${msg}`,'error');
        }
    }catch(e){ showToast(`Réseau: ${e.name}: ${e.message}`,'error'); }
    finally{ setLoading(false); }
}
</script>
