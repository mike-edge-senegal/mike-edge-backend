<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎛️ COCKPIT ADMIN — MIKE EDGE V3.0.1</title>
    <style>
        :root { --gold: #D4AF37; --gold-bright: #FFD700; --bg-dark: #0D1117; --bg-card: rgba(13, 17, 23, 0.95); --emerald: #50C878; --alert: #E0115F; --text: #F0F6FC; }
        body { background: var(--bg-dark); color: var(--text); font-family: sans-serif; padding: 16px; margin: 0; }
        .card { background: var(--bg-card); border: 1px solid var(--gold); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .label { font-size: 11px; color: #8B949E; text-transform: uppercase; margin-bottom: 6px; display: block; }
        input, select, textarea { width: 100%; box-sizing: border-box; background: #161B22; border: 1px solid #30363D; border-radius: 8px; padding: 10px; color: white; margin-bottom: 10px; font-size: 14px; }
        textarea { min-height: 120px; resize: vertical; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 14px; transition: opacity 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-emerald { background: var(--emerald); color: #000; margin-top: 10px; }
        .status { margin-top: 10px; font-size: 12px; font-weight: bold; text-align: center; padding: 8px; border-radius: 6px; display: none; }
        .status.ok { display: block; background: rgba(80, 200, 120, 0.15); color: var(--emerald); border: 1px solid var(--emerald); }
        .status.err { display: block; background: rgba(224, 17, 95, 0.15); color: var(--alert); border: 1px solid var(--alert); }
        .status.warn { display: block; background: rgba(212, 175, 55, 0.15); color: var(--gold-bright); border: 1px solid var(--gold); }
    </style>
</head>
<body>
    <div style="text-align:center; margin-bottom:20px;">
        <h1 style="color:var(--gold); margin:0;">MIKE EDGE ADMIN</h1>
        <p style="font-size:11px; color:#8B949E; margin-top:6px;">CONNECTÉ AU SERVEUR V12.2</p>
    </div>

    <div class="card">
        <label class="label">Clé Admin Secrète :</label>
        <input type="password" id="adminKey" placeholder="Saisir votre clé..." autocomplete="off">

        <label class="label">Catégorie :</label>
        <select id="categorySelect">
            <option value="ELITE_MONDIALE">🏆 Élite Mondiale</option>
            <option value="FRANCE">🇫🇷 France</option>
            <option value="ESPAGNE">🇪🇸 Espagne</option>
            <option value="ANGLETERRE">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Angleterre</option>
        </select>

        <label class="label">Fiche Telegram :</label>
        <textarea id="rawText" placeholder="Coller la fiche ici..."></textarea>

        <button class="btn btn-gold" id="testBtn" onclick="testConnection()">🔍 VÉRIFIER LA CONNEXION & LA CLÉ</button>
        <div id="statusMsg" class="status"></div>

        <button class="btn btn-emerald" id="publishBtn" style="display:none;" onclick="publishData()">🚀 PUBLIER</button>
    </div>

    <script>
        const API_URL = 'https://mike-edge-backend.onrender.com/api/v1';
        const TIMEOUT_MS = 60000; // 60s pour cold-start Render

        // Helper : fetch avec timeout
        async function fetchWithTimeout(url, options = {}) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), TIMEOUT_MS);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                if (error.name === 'AbortError') {
                    throw new Error('TIMEOUT');
                }
                throw error;
            }
        }

        // Helper : afficher un message
        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.className = 'status ' + type;
        }

        // Helper : activer/désactiver un bouton
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.style.opacity = loading ? '0.6' : '1';
        }

        // ÉTAPE 1 : Tester la connexion
        async function testConnection() {
            const key = document.getElementById('adminKey').value.trim();
            const status = document.getElementById('statusMsg');
            const publishBtn = document.getElementById('publishBtn');

            if (!key) {
                showStatus('❌ Saisissez d\'abord votre clé admin.', 'err');
                return;
            }

            setLoading('testBtn', true);
            showStatus('⏳ Connexion au serveur... (peut prendre jusqu\'à 60s)', 'warn');
            publishBtn.style.display = 'none';

            try {
                // On utilise un endpoint qui ne crée PAS de données (ex: /health ou /status)
                // Si ton backend n'a pas d'endpoint health, utilise /import avec raw_text vide
                // qui doit retourner une erreur de validation (422) si la clé est bonne
                const response = await fetchWithTimeout(`${API_URL}/import`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
                    body: JSON.stringify({ raw_text: '' }) // vide = validation error, pas d'insertion
                });

                if (response.status === 403) {
                    showStatus('❌ Clé Admin incorrecte.', 'err');
                } else if (response.status === 401) {
                    showStatus('❌ Clé Admin manquante ou invalide.', 'err');
                } else if (response.status === 422 || response.status === 400) {
                    // 422/400 = validation error sur raw_text vide = le serveur a lu la clé et l'a acceptée
                    showStatus('✅ CONNEXION OK — Clé acceptée !', 'ok');
                    publishBtn.style.display = 'block';
                } else if (response.ok) {
                    // Si jamais le serveur accepte raw_text vide (étrange mais possible)
                    showStatus('✅ CONNEXION OK — Clé acceptée !', 'ok');
                    publishBtn.style.display = 'block';
                } else {
                    showStatus('⚠️ Erreur serveur : ' + response.status, 'err');
                }
            } catch (error) {
                if (error.message === 'TIMEOUT') {
                    showStatus('⏱️ DÉLAI DÉPASSÉ (60s). Le serveur Render démarre probablement. Réessayez dans 30s.', 'warn');
                } else {
                    showStatus('❌ SERVEUR INJOIGNABLE. Vérifiez votre connexion ou que Render est actif.', 'err');
                }
            } finally {
                setLoading('testBtn', false);
            }
        }

        // ÉTAPE 2 : Publier
        async function publishData() {
            const key = document.getElementById('adminKey').value.trim();
            const text = document.getElementById('rawText').value.trim();
            const cat = document.getElementById('categorySelect').value;

            if (!text) {
                showStatus('❌ La fiche Telegram est vide.', 'err');
                return;
            }

            setLoading('publishBtn', true);
            showStatus('⏳ Publication en cours...', 'warn');

            try {
                const response = await fetchWithTimeout(`${API_URL}/import`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
                    body: JSON.stringify({ raw_text: text, category_override: cat })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok && data.success) {
                    showStatus('✅ FICHE PUBLIÉE AVEC SUCCÈS !', 'ok');
                    document.getElementById('rawText').value = ''; // vider le champ
                } else {
                    const err = data.errors ? JSON.stringify(data.errors) : 'Erreur ' + response.status;
                    showStatus('❌ ERREUR : ' + err, 'err');
                }
            } catch (error) {
                if (error.message === 'TIMEOUT') {
                    showStatus('⏱️ DÉLAI DÉPASSÉ. Le serveur met trop de temps à répondre. Réessayez.', 'warn');
                } else {
                    showStatus('❌ ERREUR RÉSEAU : ' + error.message, 'err');
                }
            } finally {
                setLoading('publishBtn', false);
            }
        }
    </script>
</body>
</html>
